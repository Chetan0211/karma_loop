# Name of your application. Used to uniquely configure containers.
service: karma_loop

# Name of the container image (pushed to ghcr.io/chetan0211/karma_loop).
image: chetan0211/karma_loop

# Proxmox LXC container "karmaloop" (CT 102).
# From the LAN we reach it directly; from GitHub Actions we go through the
# VPS reverse tunnel (KAMAL_HOST=129.154.46.176, KAMAL_SSH_PORT=54322).
servers:
  web:
    hosts:
      - <%= ENV.fetch("KAMAL_HOST", "192.168.0.152") %>
  job:
    hosts:
      - <%= ENV.fetch("KAMAL_HOST", "192.168.0.152") %>
    cmd: bundle exec sidekiq

# Cloudflare terminates TLS and reaches us over the VPS tunnel
# (VPS:8080 -> CT:80), so kamal-proxy itself serves plain HTTP on port 80.
proxy:
  app_port: 3000
  ssl: false
  forward_headers: true
  hosts:
    - kloop.chetan0211.org
  healthcheck:
    path: /up
    interval: 3
    timeout: 5

ssh:
  user: root
  port: <%= ENV.fetch("KAMAL_SSH_PORT", 22) %>
  keys: ["~/.ssh/id_rsa_home_server"]
  # Away from home: KAMAL_VIA_PROXMOX=1 jumps through the Proxmox host (VPS:54321).
  <% if ENV["KAMAL_VIA_PROXMOX"] %>
  proxy_command: "ssh -i ~/.ssh/id_rsa_home_server -p 54321 -W %h:%p root@129.154.46.176"
  <% end %>

registry:
  server: ghcr.io
  username: Chetan0211
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  local: true

accessories:
  db:
    image: postgres:15
    host: <%= ENV.fetch("KAMAL_HOST", "192.168.0.152") %>
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: chetan
        POSTGRES_DB: karma_loop_production
      secret:
        - POSTGRES_PASSWORD
    volumes:
      - karma_loop_db_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    host: <%= ENV.fetch("KAMAL_HOST", "192.168.0.152") %>
    port: "127.0.0.1:6379:6379"
    cmd: redis-server --appendonly yes
    volumes:
      - karma_loop_redis_data:/data
  elasticsearch:
    image: elasticsearch:8.11.0
    host: <%= ENV.fetch("KAMAL_HOST", "192.168.0.152") %>
    port: "127.0.0.1:9200:9200"
    env:
      clear:
        discovery.type: single-node
        xpack.security.enabled: "false"
        xpack.security.http.ssl.enabled: "false"
        ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - karma_loop_es_data:/usr/share/elasticsearch/data

env:
  clear:
    DB_HOST: karma_loop-db
    REDIS_URL: redis://karma_loop-redis:6379/0
    ELASTICSEARCH_URL: http://karma_loop-elasticsearch:9200
  secret:
    - RAILS_MASTER_KEY
    - POSTGRES_PASSWORD
    - SECRET_KEY_BASE
    - CLOUDFLARE_R2_ENDPOINT
    - CLOUDFLARE_R2_ACCESS_KEY_ID
    - CLOUDFLARE_R2_SECRET_ACCESS_KEY
    - CLOUDFLARE_R2_BUCKET_NAME
    - CLOUDFLARE_R2_BUCKET_PUB_ENDPOINT
    - BREVO_SMTP_SERVER
    - BREVO_SMTP_PORT
    - BREVO_DOMAIN
    - BREVO_SMTP_USER_NAME
    - BREVO_SMTP_PASSWORD
    - GIPHY_API_KEY

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
  reindex: app exec --reuse --roles=web "bin/rails searchkick:reindex:all"
