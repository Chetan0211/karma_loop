# Name of your application. Used to uniquely configure containers.
service: karma_loop

# Name of the container image.
image: ghcr.io/Chetan0211/karma_loop

# Deploy to these servers.
servers:
  web:
    hosts:
      - <%= ENV["SERVER_IP"] %>
  job:
    hosts:
      - <%= ENV["SERVER_IP"] %>
    cmd: bundle exec sidekiq

proxy:
  app_port: 80 
  run:
    http_port: 8080

ssh:
  user: chetan
  port: 54321
  keys: ["~/.ssh/id_rsa_home_server"]

registry:
  server: ghcr.io
  username: Chetan0211
  password:
    - KAMAL_REGISTRY_PASSWORD

accessories:
  db:
    image: postgres:15
    host: <%= ENV["DB_HOST_IP"] %>
    port: 5432
    env:
      clear:
        POSTGRES_USER: chetan
        POSTGRES_DB: karma_loop_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - /home/chetan/project_data/karma_loop/db_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    host: <%= ENV["REDIS_HOST_IP"] %>
    port: 6379

env:
  clear:
    DB_HOST: karma_loop-db
    REDIS_URL: redis://karma_loop-redis:6379/0
  secret:
    - RAILS_MASTER_KEY
    - POSTGRES_PASSWORD
    - SECRET_KEY_BASE
    - CLOUDFLARE_R2_ENDPOINT
    - CLOUDFLARE_R2_ACCESS_KEY_ID
    - CLOUDFLARE_R2_SECRET_ACCESS_KEY
    - CLOUDFLARE_R2_BUCKET_NAME
    - CLOUDFLARE_R2_BUCKET_PUB_ENDPOINT
  
