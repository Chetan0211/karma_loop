name: Deploy (Kamal)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy using kamal
    runs-on: ubuntu-latest
    environment: production

    env:
      # Reach the Proxmox container through the VPS reverse tunnel.
      KAMAL_HOST: 129.154.46.176
      KAMAL_SSH_PORT: 54322

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Install ruby runtime
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install Kamal command line tool
        run: gem install kamal -v 2.11.0
      - name: Initialize SSH Agent with Deployment Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Initialize docker buildx
        uses: docker/setup-buildx-action@v3
      - name: Execute kamal deploy
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GHCR_TOKEN }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          CLOUDFLARE_R2_BUCKET_PUB_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_BUCKET_PUB_ENDPOINT }}
          BREVO_SMTP_SERVER: ${{ secrets.BREVO_SMTP_SERVER }}
          BREVO_SMTP_PORT: ${{ secrets.BREVO_SMTP_PORT }}
          BREVO_DOMAIN: ${{ secrets.BREVO_DOMAIN }}
          BREVO_SMTP_USER_NAME: ${{ secrets.BREVO_SMTP_USER_NAME }}
          BREVO_SMTP_PASSWORD: ${{ secrets.BREVO_SMTP_PASSWORD }}
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
        run: kamal deploy
